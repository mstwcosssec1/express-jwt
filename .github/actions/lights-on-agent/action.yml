name: "Lights On Autonomous Agent"
description: "Composite action that runs the Lights On multi-engine autonomous maintenance agent (Copilot, Claude, Codex, OpenRouter)."

inputs:
  task:
    description: "Task (e.g., bootstrap-threat-model, issue-responder, pr-reviewer, dependency-updater, dependency-migration-planner, dependency-migrator)"
    required: true
  tier:
    description: "Model routing tier: default or reasoning"
    required: false
    default: "default"
  sandbox_image:
    description: "Trusted command-worker image; empty uses the runner's digest-pinned default"
    required: false
    default: ""
  event_file:
    description: "Optional path to serialized GitHub event JSON payload"
    required: false
    default: ""
  context_file:
    description: "Optional path (or comma-separated paths) to additional context files"
    required: false
    default: ""
  dependency_selection_file:
    description: "Trusted Step D selection for a bounded dependency update or approved migration"
    required: false
    default: ""
  output_file:
    description: "Path where the structured agent JSON output will be written"
    required: false
    default: "/tmp/lights-on-result.json"
  install_threat_model_skills:
    description: "Prepare cached threat-model skills; always enabled for bootstrap-threat-model"
    required: false
    default: "false"
  restore_state:
    description: "Restore shared state; set false when the calling workflow already restored it"
    required: false
    default: "true"

outputs:
  status:
    description: "Execution status (completed, skipped, blocked, failed); failed exits nonzero"
    value: ${{ steps.run-agent.outputs.status }}
  provider:
    description: "Resolved LLM provider (copilot, claude, codex, openrouter)"
    value: ${{ steps.run-agent.outputs.provider }}
  model:
    description: "Resolved model identifier"
    value: ${{ steps.run-agent.outputs.model }}
  verdict:
    description: "Review or triage verdict (APPROVE, REQUEST_CHANGES, COMMENT, NONE)"
    value: ${{ steps.run-agent.outputs.verdict }}
  action_taken:
    description: "Action taken by the agent"
    value: ${{ steps.run-agent.outputs.action_taken }}
  risk_level:
    description: "Assessed risk level (low, medium, high, critical)"
    value: ${{ steps.run-agent.outputs.risk_level }}
  result_file:
    description: "Path to the structured JSON result file"
    value: ${{ steps.run-agent.outputs.result_file }}
  cache_writable:
    description: "Whether the runtime cache token permits saving shared state"
    value: ${{ steps.cache-access.outputs.writable }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js 24
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false

    - name: Check effective cache access
      id: cache-access
      uses: $/.github/actions/lights-on-cache-access

    - name: Restore shared Lights On state
      if: inputs.restore_state != 'false' && steps.cache-access.outputs.readable == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /tmp/lights-on-cache
          /tmp/lights-on-threat-model
        key: lights-on-state-v2-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          lights-on-state-v2-${{ github.repository }}-

    - name: Check Lights On configuration and enabled state
      id: check-config
      shell: bash
      run: |
        node .github/lights-on/runner/load-config.mjs --github-output

    - name: Require isolated command worker
      if: steps.check-config.outputs.enabled != 'false'
      shell: bash
      run: |
        docker info > /dev/null

    - name: Prepare locked inference-only Copilot CLI
      if: steps.check-config.outputs.enabled != 'false' && steps.check-config.outputs.copilot_backend == 'cli' && env.COPILOT_GITHUB_TOKEN != ''
      shell: bash
      run: node .github/lights-on/runner/install-copilot-tools.mjs --backend cli --directory "$RUNNER_TEMP/lights-on-copilot-cli"

    - name: Prepare pinned Copilot SDK runtime
      if: steps.check-config.outputs.enabled != 'false' && steps.check-config.outputs.copilot_backend == 'sdk' && env.COPILOT_GITHUB_TOKEN != ''
      shell: bash
      run: |
        node .github/lights-on/runner/install-copilot-sdk.mjs --directory "$RUNNER_TEMP/lights-on-copilot-sdk"

    - name: Install alpha-omega-security/threat-model skills
      if: steps.check-config.outputs.enabled != 'false' && (inputs.task == 'bootstrap-threat-model' || inputs.install_threat_model_skills == 'true')
      shell: bash
      run: |
        node --input-type=module -e 'import { ensureThreatModelSkills } from "./.github/lights-on/runner/ensure-threat-model.mjs"; ensureThreatModelSkills({ installToWorkspace: false });'

    - name: Run Lights On multi-engine agent
      id: run-agent
      shell: bash
      env:
        INPUT_TASK: ${{ inputs.task }}
        INPUT_TIER: ${{ inputs.tier }}
        INPUT_EVENT_FILE: ${{ inputs.event_file }}
        INPUT_CONTEXT_FILE: ${{ inputs.context_file }}
        INPUT_DEPENDENCY_SELECTION_FILE: ${{ inputs.dependency_selection_file }}
        INPUT_OUTPUT_FILE: ${{ inputs.output_file }}
        LIGHTS_ON_UPSTREAM_REPO: ${{ steps.check-config.outputs.upstream_repo }}
        LIGHTS_ON_SANDBOX_IMAGE: ${{ inputs.sandbox_image }}
        LIGHTS_ON_COPILOT_SDK_DIR: ${{ runner.temp }}/lights-on-copilot-sdk
        LIGHTS_ON_COPILOT_CLI_DIR: ${{ runner.temp }}/lights-on-copilot-cli
      run: |
        args=(--task "$INPUT_TASK" --tier "$INPUT_TIER" --output "$INPUT_OUTPUT_FILE")
        if [ "$INPUT_TASK" = "bootstrap-threat-model" ]; then
          args+=(--context-file /tmp/lights-on-threat-model/skills/threat-model/SKILL.md)
        fi
        if [ -n "$INPUT_EVENT_FILE" ]; then
          args+=(--event-file "$INPUT_EVENT_FILE")
        fi
        if [ -n "$INPUT_CONTEXT_FILE" ]; then
          args+=(--context-file "$INPUT_CONTEXT_FILE")
        fi
        if [ -n "$INPUT_DEPENDENCY_SELECTION_FILE" ]; then
          args+=(--dependency-selection "$INPUT_DEPENDENCY_SELECTION_FILE")
        fi

        echo "result_file=${INPUT_OUTPUT_FILE//[$'\r\n']/}" >> "$GITHUB_OUTPUT"
        node .github/lights-on/runner/run-agent.mjs "${args[@]}"
